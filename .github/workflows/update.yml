name: Update Subscriptions

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checker
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python checker.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git add bs/*.conf || true
          git add FastCone_Switzerland.json Griffon_France.json VIP_LTE_Finland.json || true
          git add Nebula_Auto.json Nebula_BS_*.json || true
          git add AddSub_Auto.json AddSub_*.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update subscription files"
          git pull --rebase origin main || true
          git push
